server {
    server_name experimente-plus.mahina.fun;

    # Defining the complete set at server scope intentionally replaces the
    # host-wide add_header inheritance for this virtual host. Values emitted by
    # AdonisJS are preserved by the maps; defaults also cover upstream errors.
    add_header X-Frame-Options $experimente_plus_x_frame_options always;
    add_header X-Content-Type-Options $experimente_plus_x_content_type_options always;
    add_header Strict-Transport-Security $experimente_plus_hsts always;
    add_header Referrer-Policy $experimente_plus_referrer_policy always;
    add_header X-XSS-Protection "0" always;

    # Establishment media uploads go through the app, so keep this generous.
    client_max_body_size 50M;

    location / {
        # Hide upstream copies before re-emitting one canonical value above.
        # The $upstream_http_* variables remain available to the maps.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-XSS-Protection;

        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/experimente-plus.mahina.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/experimente-plus.mahina.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = experimente-plus.mahina.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name experimente-plus.mahina.fun;
    return 404; # managed by Certbot
}
