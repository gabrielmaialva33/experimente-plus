# Loaded from nginx's http context. Preserve a response-specific policy from
# AdonisJS and provide a secure default when the upstream did not emit one.
map $upstream_http_x_frame_options $experimente_plus_x_frame_options {
    ""      "DENY";
    default $upstream_http_x_frame_options;
}

map $upstream_http_x_content_type_options $experimente_plus_x_content_type_options {
    ""      "nosniff";
    default $upstream_http_x_content_type_options;
}

map $upstream_http_strict_transport_security $experimente_plus_hsts {
    ""      "max-age=15552000";
    default $upstream_http_strict_transport_security;
}

map $upstream_http_referrer_policy $experimente_plus_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default $upstream_http_referrer_policy;
}

# The public catalogue search may carry the visitor's position (`sort=distance`
# with `lat` and `lng`), which must never be written down. Its access-log line
# keeps the method, path and status, never the query string; every other
# request is logged in nginx's standard `combined` format, as before.
map $uri $experimente_plus_position_request {
    ~^/api/v1/catalog/cities/[^/]+/establishments/?$ 1;
    default 0;
}

map $experimente_plus_position_request $experimente_plus_full_request {
    1       0;
    default 1;
}

log_format experimente_plus_without_query
    '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
