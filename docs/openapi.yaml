        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstablishmentMediaRequest'
      responses:
        '200':
          description: Updated media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: No effective field or domain rule rejected the update
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Media not found in the editable revision
        '422':
          description: Validation failed
    delete:
