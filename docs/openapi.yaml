  /api/v1/benefit-redemptions:
    post:
      operationId: redeemPresentedBenefit
      summary: Confirm a presented benefit
      description: |
        Revalidates all domain and organization rules inside a transaction. Repeating the same
        valid token returns the original receipt, so a client may retry after an ambiguous network
        failure without creating a second redemption.
      tags: [Benefits]
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitPresentationTokenRequest'
      responses:
        '200':
          description: Existing or newly created immutable redemption receipt
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitRedemptionReceipt'
        '400':
          $ref: '#/components/responses/PrivateBenefitRedemptionBadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '404':
