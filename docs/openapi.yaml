              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMobileProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/PrivateNotFoundError'
        '422':
          $ref: '#/components/responses/PrivateValidationError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

    delete:
      operationId: deleteOwnAccount
      summary: Delete the authenticated account
      description: Requires the current password and the literal confirmation EXCLUIR MINHA CONTA. The user is anonymized and active API credentials are revoked while historical references remain intact.
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                confirmation:
                  type: string
                  const: EXCLUIR MINHA CONTA
      responses:
        '204':
          description: Account anonymized and credentials revoked
        '400':
          description: Incorrect password or confirmation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me/context:
    get:
      operationId: getMobileContext
      summary: Get user, active operation and mobile capabilities
      description: |
        Returns a closed projection for bootstrapping a thin client. Tenant means an isolated
        platform operation; city remains a public discovery dimension. The optional
        `x-tenant-id` override is accepted only when the actor belongs to that active operation.

        `partner.enabled` reflects active organization membership, not a global role. The client
        must render read and validation actions from `partner.redemptions.read` and
        `partner.redemptions.validate`; every endpoint still reauthorizes on the server.
      tags: [Profile]
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Current mobile context
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileContext'
        '400':
          $ref: '#/components/responses/PrivateBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

