      description: The payload must contain every current media item exactly once and use a contiguous zero-based order.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderEstablishmentMediaRequest'
      responses:
        '200':
          description: Reordered media collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Incomplete collection, duplicate identifiers or invalid order
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Editable establishment revision not found
        '422':
          description: Validation failed

