        - Tenants
      responses:
        '200':
          description: Tenant memberships retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        slug:
                          type: string
                        is_active:
                          type: boolean
                        role:
                          type: string
                          enum: [owner, admin, member]
        '401':
          $ref: '#/components/responses/UnauthorizedError'

