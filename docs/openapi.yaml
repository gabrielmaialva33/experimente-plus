  /api/v1/benefit-redemptions/preview:
    post:
      operationId: previewBenefitRedemption
      summary: Preview a presented benefit before confirmation
      description: |
        Revalidates the temporary token and exposes holder details only to an actor allowed to
        validate redemptions for the owning organization. Preview never creates a redemption.
      tags: [Benefits]
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
