          application/json:
            schema:
              $ref: '#/components/schemas/EstablishmentRequiredModerationReasonRequest'
      responses:
        '200':
          description: Suspended establishment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentLifecycleModerationResult'
        '400':
          description: Archived establishment cannot be suspended
        '401':
