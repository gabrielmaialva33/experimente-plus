              schema:
                $ref: '#/components/schemas/CatalogCityCategoriesResponse'
        '404':
          description: Public operation or active city not found

  /api/v1/catalog/cities/{citySlug}/establishments:
    get:
      operationId: searchCatalogEstablishments
      summary: Search discoverable establishments inside a city
      description: |
        Searches the rebuildable PostgreSQL catalog projection with privacy-safe
        filters, sponsored separation and deterministic pagination.

        A syntactically valid category slug that does not resolve to an active
        category is represented as a successful empty search: the API returns 200,
        preserves the slug in query.category, sets context.category to null and
        returns empty sponsored_results and organic_results arrays. The canonical
        SSR route /cidades/{citySlug}/categorias/{categorySlug} returns 404 for the
        same missing route identity so that a nonexistent category page is not
        indexable.

        Pagination is canonicalized in the search query: when `page` is greater
        than `last_page`, the response returns the real last page and its rows.
        Searches with no organic results use page 1. The `meta.page` value and all
        pagination URLs always describe that effective page.
      tags: [Catalog]
      security: []
      parameters:
        - name: citySlug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          description: A well-formed but unknown or inactive slug produces the canonical empty 200 response; a malformed slug produces 422.
          schema:
            type: string
            maxLength: 180
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - name: open_now
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, name, recent]
            default: relevance
      responses:
        '200':
          description: Sponsored and organic catalog results. An unknown or inactive category is represented by `context.category = null` and empty result arrays.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResult'
        '404':
          description: Public operation or active city not found
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/catalog/cities/{citySlug}/establishments/{establishmentSlug}:
