  /api/v1/establishments/{id}/media:
    get:
      operationId: listEstablishmentMedia
      summary: List the editable or published media composition
      description: Requires media.read plus authorized organization membership. Draft content remains tenant-scoped and private.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Administrative media composition ordered by sort_order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentMedia'
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Establishment not found in the active tenant or membership scope
    post:
      operationId: uploadEstablishmentMedia
      summary: Upload an image to the editable establishment revision
      description: Accepts valid JPEG, PNG or WebP up to 10 MiB. Extension, reported MIME type and binary signature must agree. The first image becomes the cover unless is_cover is supplied.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [gallery, logo, menu, interior, exterior, product, team, service]
                  default: gallery
                is_cover:
                  type: boolean
                alt_text:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 180
                caption:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Pending media created and associated with the editable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Invalid binary content, MIME mismatch, unsupported image or domain rule failure
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Editable establishment revision not found
        '422':
          description: Multipart or metadata validation failed

