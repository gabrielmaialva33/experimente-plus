openapi: 3.1.0
info:
  title: Experimente+ API
  version: 0.1.0
  description: |
    ## Experimente+ API

    API da plataforma regional Experimente+, construída com AdonisJS 7, React e Inertia. Neste estágio inicial, o contrato documenta a fundação compartilhada de identidade, autorização, workspaces, arquivos e saúde da aplicação. Os domínios específicos do produto serão adicionados após o planejamento funcional.

    ### Foundation capabilities

    - **Access JWTs**: Short-lived signed bearer tokens for API requests
    - **Opaque Refresh Tokens**: Rotated on every use and persisted only as HMAC hashes
    - **Global RBAC**: Roles, direct permissions, inheritance, and cache invalidation
    - **Tenant Workspaces**: Verified active-tenant context, personal workspace onboarding, and workspace creation
    - **File Management**: Tenant-scoped upload, listing, and owner-aware deletion across multiple storage drivers
    - **Account Lifecycle**: Email verification, single-use password reset, and anonymized self-deletion
    - **Health Monitoring**: Public readiness and dependency checks

    ## Authentication

    1. **Login**: POST to `/api/v1/sessions/sign-in` with your credentials
    2. **Get Tokens**: Extract `access_token` and `refresh_token` from `auth`
    3. **Use Access Token**: Include `Authorization: Bearer <access_token>`
    4. **Rotate Tokens**: POST the opaque refresh token to `/api/v1/sessions/refresh`

    ### Token Management

    - **API Access Token Lifetime**: 15 minutes
    - **Web Cookie Lifetime**: 1 hour
    - **Refresh Token Lifetime**: 3 days
    - **Access Token Format**: JWT with `token_use=access`
    - **Refresh Token Format**: Opaque random value; it is not a JWT

    ## API Conventions

    ### Request Format
    - **Content-Type**: `application/json` for all requests (except file uploads)
    - **Pagination**: Use `?page=1&per_page=10` query parameters
    - **Sorting**: Use `?sort_by=field&order=asc` or `?sort_by=field&order=desc`
    - **Searching**: Use `?search=term` for text search

    ### Response Format
    - **Success**: HTTP 2xx with JSON body
    - **Errors**: HTTP 4xx/5xx with standardized error format
    - **Timestamps**: ISO 8601 format
    - **Database Fields**: snake_case naming convention

    ### Common Headers
    ```
    Authorization: Bearer <token>
    Content-Type: application/json
    Accept: application/json
    ```

  contact:
    name: Experimente+ Engineering
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:3333
    description: Local development server
  - url: https://api.example.com
    description: Production placeholder (replace when the public domain is defined)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access JWT. Opaque refresh tokens are never accepted here.

  schemas:
    Region:
      type: object
      required: [id, tenant_id, name, slug, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    City:
      type: object
      required:
        [
          id,
          tenant_id,
          region_id,
          name,
          slug,
          state_code,
          country_code,
          timezone,
          sort_order,
          is_active,
        ]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        region_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        state_code:
          type: string
          minLength: 2
          maxLength: 2
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        ibge_code:
          type: [string, 'null']
        timezone:
          type: string
          example: America/Sao_Paulo
        latitude:
          type: [number, 'null']
          format: double
        longitude:
          type: [number, 'null']
          format: double
        sort_order:
          type: integer
        is_active:
          type: boolean
        region:
          oneOf:
            - $ref: '#/components/schemas/Region'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryFamily:
      type: object
      required: [id, tenant_id, name, slug, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, tenant_id, family_id, name, slug, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        family_id:
          type: integer
        parent_id:
          type: [integer, 'null']
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        attribute_definitions:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttributeDefinition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryAttributeDefinition:
      type: object
      required:
        [
          id,
          tenant_id,
          category_id,
          key,
          name,
          data_type,
          is_required,
          is_filterable,
          is_public,
          applies_to_descendants,
          sort_order,
          is_active,
        ]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        category_id:
          type: integer
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        data_type:
          type: string
          enum: [text, long_text, boolean, integer, decimal, single_select, multi_select, url]
        unit:
          type: [string, 'null']
        validation_rules:
          type: object
          additionalProperties: true
        is_required:
          type: boolean
        is_filterable:
          type: boolean
        is_public:
          type: boolean
        applies_to_descendants:
          type: boolean
        sort_order:
          type: integer
        is_active:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttributeOption'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryAttributeOption:
      type: object
      required: [id, tenant_id, attribute_definition_id, label, value, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        attribute_definition_id:
          type: integer
        label:
          type: string
        value:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRegionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCityInput:
      type: object
      required: [region_id, name, state_code, timezone]
      properties:
        region_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        state_code:
          type: string
        country_code:
          type: string
          default: BR
        ibge_code:
          type: [string, 'null']
        timezone:
          type: string
          example: America/Sao_Paulo
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryFamilyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryInput:
      type: object
      required: [family_id, name]
      properties:
        family_id:
          type: integer
        parent_id:
          type: [integer, 'null']
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryAttributeDefinitionInput:
      type: object
      required: [category_id, key, name, data_type]
      properties:
        category_id:
          type: integer
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        data_type:
          type: string
          enum: [text, long_text, boolean, integer, decimal, single_select, multi_select, url]
        unit:
          type: [string, 'null']
        is_required:
          type: boolean
        is_filterable:
          type: boolean
        is_public:
          type: boolean
        applies_to_descendants:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryAttributeOptionInput:
      type: object
      required: [attribute_definition_id, label]
      properties:
        attribute_definition_id:
          type: integer
        label:
          type: string
        value:
          type: string
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        username:
          type: [string, 'null']
          example: 'johndoe'
        email_verified:
          type: boolean
          example: true
        email_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'User'
        description:
          type: string
          example: 'Regular user role'
        slug:
          type: string
          enum: [root, admin, user, guest, editor]
          example: 'user'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        email_verification_sent:
          type: boolean
          description: Present on sign-up responses; false means the account was created but email delivery failed.

    AuthTokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          description: Short-lived JWT accepted by bearer-authenticated endpoints.
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        refresh_token:
          type: string
          description: Opaque one-time refresh credential rotated after every successful refresh.
          example: 'D4m6j6pTW1u3Jf_Z0Q4K7rJch7Jv8k9xQ4Q6xk2MsGv...'

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 32
          description: Opaque refresh token returned by sign-in, sign-up, tenant switch, or refresh.

    PasswordResetRequest:
      type: object
      required: [token, password, password_confirmation]
      properties:
        token:
          type: string
          minLength: 32
          description: Opaque single-use password reset token delivered by email.
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
          minLength: 8

    Tenant:
      type: object
      required: [id, name, slug, role]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
        role:
          type: string
          enum: [owner, admin, member]

    FileListItem:
      type: object
      required: [id, client_name, file_name, file_size, file_type, file_category, url, owner]
      properties:
        id:
          type: integer
        client_name:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
        file_type:
          type: string
        file_category:
          type: string
          enum: [image, document, video, audio, file]
        url:
          type: string
        owner:
          type: object
          required: [id, full_name]
          properties:
            id:
              type: integer
            full_name:
              type: string
        created_at:
          type: [string, 'null']
          format: date-time

    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: 'Validation error'
              field:
                type: string
                example: 'email'
              rule:
                type: string
                example: 'email'

    Pagination:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 100
            per_page:
              type: integer
              example: 10
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            first_page:
              type: integer
              example: 1
            first_page_url:
              type: string
              example: '/?page=1'
            last_page_url:
              type: string
              example: '/?page=10'
            next_page_url:
              type: string
              example: '/?page=2'
            previous_page_url:
              type: string
              example: null

    FileUploadResponse:
      type: object
      properties:
        url:
          type: string
          example: 'https://storage.example.com/files/abc123.pdf'
        clientName:
          type: string
          example: 'document.pdf'
        fileCategory:
          type: string
          enum: [image, document, video, audio, file]
          example: 'document'
        fileType:
          type: string
          example: 'application/pdf'
        size:
          type: integer
          example: 12345
        extname:
          type: string
          example: 'pdf'

    EstablishmentRevision:
      type: object
      required: [id, tenant_id, establishment_id, version, status, rules_version]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        establishment_id:
          type: integer
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, pending_review, changes_requested, approved, rejected]
        city_id:
          type: [integer, 'null']
        public_name:
          type: [string, 'null']
        slug:
          type: [string, 'null']
        short_description:
          type: [string, 'null']
        description:
          type: [string, 'null']
        public_phone:
          type: [string, 'null']
        whatsapp:
          type: [string, 'null']
        public_email:
          type: [string, 'null']
        website:
          type: [string, 'null']
          format: uri
        instagram:
          type: [string, 'null']
        booking_url:
          type: [string, 'null']
          format: uri
        availability_type:
          type: string
          enum: [regular_hours, appointment_only, always_open]
        rules_version:
          type: integer
          minimum: 1
        submitted_at:
          type: [string, 'null']
          format: date-time
        reviewed_at:
          type: [string, 'null']
          format: date-time
        review_notes:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/EstablishmentAddress'
            - type: 'null'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentCategory'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentHour'
        special_days:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentSpecialDay'

    Establishment:
      type: object
      required:
        [id, tenant_id, organization_id, lifecycle_status, business_status, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        organization_id:
          type: integer
        lifecycle_status:
          type: string
          enum: [active, suspended, archived]
        business_status:
          type: string
          enum: [open, temporarily_closed, permanently_closed]
        published_revision_id:
          type: [integer, 'null']
        published_revision:
          oneOf:
            - $ref: '#/components/schemas/EstablishmentRevision'
            - type: 'null'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentRevision'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EstablishmentRevisionInput:
      type: object
      properties:
        public_name:
          type: string
          minLength: 2
          maxLength: 160
        city_id:
          type: [integer, 'null']
          minimum: 1
        slug:
          type: [string, 'null']
          maxLength: 180
        short_description:
          type: [string, 'null']
          maxLength: 320
        description:
          type: [string, 'null']
          maxLength: 10000
        public_phone:
          type: [string, 'null']
        whatsapp:
          type: [string, 'null']
        public_email:
          type: [string, 'null']
          format: email
        website:
          type: [string, 'null']
          format: uri
        instagram:
          type: [string, 'null']
        booking_url:
          type: [string, 'null']
          format: uri
        availability_type:
          type: [string, 'null']
          enum: [regular_hours, appointment_only, always_open, null]

    EstablishmentCreateInput:
      allOf:
        - $ref: '#/components/schemas/EstablishmentRevisionInput'
        - type: object
          required: [public_name]

    EstablishmentAddress:
      type: object
      properties:
        postal_code:
          type: [string, 'null']
        street:
          type: [string, 'null']
        number:
          type: [string, 'null']
        without_number:
          type: boolean
        complement:
          type: [string, 'null']
        district:
          type: [string, 'null']
        reference:
          type: [string, 'null']
        latitude:
          type: [number, string, 'null']
        longitude:
          type: [number, string, 'null']
        coordinate_source:
          type: [string, 'null']
          enum: [manual, geocoded, imported, null]

    EstablishmentCategory:
      type: object
      required: [category_id, is_primary, sort_order]
      properties:
        category_id:
          type: integer
        is_primary:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
        category:
          $ref: '#/components/schemas/Category'

    EstablishmentCategoryListInput:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [category_id]
            properties:
              category_id:
                type: integer
                minimum: 1
              is_primary:
                type: boolean
                default: false
              sort_order:
                type: integer
                minimum: 0
                default: 0

    EstablishmentAttributeListInput:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: array
          items:
            type: object
            required: [attribute_definition_id]
            properties:
              attribute_definition_id:
                type: integer
                minimum: 1
              value:
                nullable: true
              option_ids:
                type: array
                uniqueItems: true
                items:
                  type: integer
                  minimum: 1

    EstablishmentHour:
      type: object
      required: [weekday, opens_at, closes_at, spans_next_day, sort_order]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          example: '08:00'
        closes_at:
          type: string
          example: '18:00'
        spans_next_day:
          type: boolean
        sort_order:
          type: integer
          minimum: 0

    EstablishmentHoursInput:
      type: object
      required: [hours]
      properties:
        hours:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentHour'

    EstablishmentSpecialDay:
      type: object
      required: [date, status]
      properties:
        date:
          type: string
          format: date
        status:
          type: string
          enum: [closed, custom_hours]
        note:
          type: [string, 'null']
        intervals:
          type: array
          items:
            type: object
            required: [opens_at, closes_at]
            properties:
              opens_at:
                type: string
                example: '09:00'
              closes_at:
                type: string
                example: '14:00'
              spans_next_day:
                type: boolean
                default: false
              sort_order:
                type: integer
                minimum: 0
                default: 0

    EstablishmentSpecialDaysInput:
      type: object
      required: [special_days]
      properties:
        special_days:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentSpecialDay'

    EstablishmentBusinessStatusInput:
      type: object
      required: [business_status]
      properties:
        business_status:
          type: string
          enum: [open, temporarily_closed, permanently_closed]

    EstablishmentCompletenessIssue:
      type: object
      required: [code, field, message, severity]
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [blocking, warning]

    EstablishmentCompleteness:
      type: object
      required: [eligible, score, blocking_issues, warnings, checked_at, rules_version]
      properties:
        eligible:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
        blocking_issues:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentCompletenessIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentCompletenessIssue'
        checked_at:
          type: string
          format: date-time
        rules_version:
          type: integer
          minimum: 1

    EffectiveCategoryAttribute:
      type: object
      required: [definition, source_category_id, required_for_primary]
      properties:
        definition:
          $ref: '#/components/schemas/CategoryAttributeDefinition'
        source_category_id:
          type: integer
        inherited_from_category_id:
          type: [integer, 'null']
        required_for_primary:
          type: boolean

    MediaAsset:
      type: object
      required:
        - id
        - media_type
        - file_extension
        - mime_type
        - width
        - height
        - checksum_sha256
        - url
      properties:
        id:
          type: integer
          minimum: 1
        media_type:
          type: string
          enum: [image]
        file_extension:
          type: string
          enum: [jpg, jpeg, png, webp]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        width:
          type: integer
          minimum: 1
          maximum: 12000
        height:
          type: integer
          minimum: 1
          maximum: 12000
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        url:
          type: string
          format: uri

    EstablishmentMedia:
      type: object
      required:
        - id
        - establishment_id
        - revision_id
        - purpose
        - is_cover
        - sort_order
        - alt_text
        - caption
        - moderation_status
        - review_notes
        - reviewed_at
        - created_at
        - updated_at
        - asset
      properties:
        id:
          type: integer
          minimum: 1
        establishment_id:
          type: integer
          minimum: 1
        revision_id:
          type: integer
          minimum: 1
        purpose:
          type: string
          enum: [gallery, logo, menu, interior, exterior, product, team, service]
        is_cover:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
          maximum: 19
        alt_text:
          type: [string, 'null']
          minLength: 1
          maxLength: 180
        caption:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        moderation_status:
          type: string
          enum: [pending, approved, rejected, quarantined]
        review_notes:
          type: [string, 'null']
        reviewed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        asset:
          $ref: '#/components/schemas/MediaAsset'

    PublicMediaAsset:
      type: object
      required: [id, media_type, file_extension, mime_type, width, height, url]
      properties:
        id:
          type: integer
          minimum: 1
        media_type:
          type: string
          enum: [image]
        file_extension:
          type: string
          enum: [jpg, jpeg, png, webp]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri

    PublicEstablishmentMedia:
      type: object
      required: [id, purpose, is_cover, sort_order, alt_text, caption, asset]
      properties:
        id:
          type: integer
          minimum: 1
        purpose:
          type: string
          enum: [gallery, logo, menu, interior, exterior, product, team, service]
        is_cover:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
        alt_text:
          type: string
          minLength: 1
          maxLength: 180
        caption:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        asset:
          $ref: '#/components/schemas/PublicMediaAsset'

    PublicEstablishmentMediaCollection:
      type: object
      required: [establishment_id, revision_id, media]
      properties:
        establishment_id:
          type: integer
          minimum: 1
        revision_id:
          type: integer
          minimum: 1
        media:
          type: array
          items:
            $ref: '#/components/schemas/PublicEstablishmentMedia'

    UpdateEstablishmentMediaRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [gallery, logo, menu, interior, exterior, product, team, service]
        alt_text:
          type: [string, 'null']
          minLength: 1
          maxLength: 180
        caption:
          type: [string, 'null']
          minLength: 1
          maxLength: 500

    MediaOrderItem:
      type: object
      required: [id, sort_order]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        sort_order:
          type: integer
          minimum: 0
          maximum: 19

    ReorderEstablishmentMediaRequest:
      type: object
      required: [media]
      additionalProperties: false
      properties:
        media:
          type: array
          minItems: 1
          maxItems: 20
          description: Complete current collection with a contiguous zero-based order.
          items:
            $ref: '#/components/schemas/MediaOrderItem'

    MediaOptionalReviewRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000

    MediaRequiredReviewRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000

    MediaModerationPage:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          additionalProperties: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EstablishmentMedia'

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    perPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page

    sortByParam:
      name: sort_by
      in: query
      schema:
        type: string
        default: id
      description: Field to sort by

    orderParam:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order

    searchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search term for filtering results

    tenantHeader:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
      description: Optional active workspace override. Membership and active status are always validated.

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Unauthorized'

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Forbidden'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Resource not found'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: System health monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Tenants
    description: Tenant membership and active workspace operations
  - name: Roles
    description: Role management operations (admin only)
  - name: Files
    description: File upload and management
  - name: Profile
    description: Current user profile operations
  - name: Permissions
    description: Permission management operations (admin only)
  - name: Establishments
    description: Stable units, revisioned public content, schedules, attributes, and completeness

  - name: Media
    description: Versioned establishment images, cover selection, ordering and moderation.

paths:
  /api/v1/public/establishments/{id}/media:
    get:
      operationId: getPublicEstablishmentMedia
      summary: Read approved media from the published establishment revision
      description: Returns only approved media associated with the currently published revision of an active establishment.
      tags: [Media]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Approved public media projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEstablishmentMediaCollection'
        '404':
          description: Published establishment not found

  /api/v1/establishments/{id}/media:
    get:
      operationId: listEstablishmentMedia
      summary: List the editable or published media composition
      description: Requires media.read plus authorized organization membership. Draft content remains tenant-scoped and private.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Administrative media composition ordered by sort_order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentMedia'
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Establishment not found in the active tenant or membership scope
    post:
      operationId: uploadEstablishmentMedia
      summary: Upload an image to the editable establishment revision
      description: Accepts valid JPEG, PNG or WebP up to 10 MiB. Extension, reported MIME type and binary signature must agree. The first image becomes the cover unless is_cover is supplied.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [gallery, logo, menu, interior, exterior, product, team, service]
                  default: gallery
                is_cover:
                  type: boolean
                alt_text:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 180
                caption:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Pending media created and associated with the editable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Invalid binary content, MIME mismatch, unsupported image or domain rule failure
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Editable establishment revision not found
        '422':
          description: Multipart or metadata validation failed

  /api/v1/establishments/{id}/media/order:
    put:
      operationId: reorderEstablishmentMedia
      summary: Replace the complete media order atomically
      description: The payload must contain every current media item exactly once and use a contiguous zero-based order.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderEstablishmentMediaRequest'
      responses:
        '200':
          description: Reordered media collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Incomplete collection, duplicate identifiers or invalid order
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Editable establishment revision not found
        '422':
          description: Validation failed

  /api/v1/establishments/{id}/media/{mediaId}:
    patch:
      operationId: updateEstablishmentMedia
      summary: Update media purpose, alternative text or caption
      description: Changing moderated metadata returns approved, rejected or quarantined media to pending review.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstablishmentMediaRequest'
      responses:
        '200':
          description: Updated media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: No effective field or domain rule rejected the update
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Media not found in the editable revision
        '422':
          description: Validation failed
    delete:
      operationId: removeEstablishmentMedia
      summary: Remove media from the editable revision
      description: Deletes the physical object only after the last revision association is removed and the database transaction commits.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Media association removed
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Media not found in the editable revision

  /api/v1/establishments/{id}/media/{mediaId}/cover:
    patch:
      operationId: selectEstablishmentMediaCover
      summary: Select the single cover image for the editable revision
      description: Rejected and quarantined media cannot become the cover. Cover selection does not change content moderation status.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Selected cover media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Media is not eligible to become the cover
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Media not found in the editable revision

  /api/v1/admin/media:
    get:
      operationId: listMediaModerationQueue
      summary: List the global media moderation queue
      description: Requires a platform moderator capability. The active tenant header remains mandatory and tenant_id may narrow the queue.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, quarantined]
            default: pending
        - in: query
          name: tenant_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated moderation queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaModerationPage'
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '422':
          description: Invalid query parameters

  /api/v1/admin/media/{id}/approve:
    post:
      operationId: approveEstablishmentMedia
      summary: Approve media for public eligibility
      description: Alternative text is required before approval. Approval alone does not publish the establishment revision.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaOptionalReviewRequest'
      responses:
        '200':
          description: Approved media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Alternative text is missing or transition is invalid
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Media not found
        '422':
          description: Validation failed

  /api/v1/admin/media/{id}/reject:
    post:
      operationId: rejectEstablishmentMedia
      summary: Reject media with a required reason
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRequiredReviewRequest'
      responses:
        '200':
          description: Rejected media; it is no longer eligible as cover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Moderation transition rejected
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Media not found
        '422':
          description: Reason validation failed

  /api/v1/admin/media/{id}/quarantine:
    post:
      operationId: quarantineEstablishmentMedia
      summary: Quarantine media with a required reason
      description: Quarantined media blocks establishment submission until removed from the editable composition.
      tags: [Media]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRequiredReviewRequest'
      responses:
        '200':
          description: Quarantined media; it is no longer eligible as cover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentMedia'
        '400':
          description: Moderation transition rejected
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Media not found
        '422':
          description: Reason validation failed
  /api/v1/catalog/regions:
    get:
      operationId: listPublicRegions
      summary: List active public regions
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Active regions with their active cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
        '404':
          description: Public operation could not be resolved

  /api/v1/catalog/cities:
    get:
      operationId: listPublicCities
      summary: List active public cities
      tags: [Catalog]
      security: []
      parameters:
        - in: query
          name: region_slug
          schema:
            type: string
          description: Optional active region slug
      responses:
        '200':
          description: Active cities for the resolved operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '404':
          description: Public operation could not be resolved

  /api/v1/catalog/cities/{citySlug}:
    get:
      operationId: getPublicCity
      summary: Get an active public city by slug
      tags: [Catalog]
      security: []
      parameters:
        - in: path
          name: citySlug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: City or public operation not found

  /api/v1/catalog/categories:
    get:
      operationId: listPublicTaxonomy
      summary: List the active public taxonomy tree
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Active category families, categories, attributes, and options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryFamily'
        '404':
          description: Public operation could not be resolved

  /api/v1/admin/geography/regions:
    get:
      operationId: listRegions
      summary: List regions in the active operation
      tags: [Geography Admin]
      parameters:
        - in: query
          name: include_inactive
          schema:
            type: boolean
      responses:
        '200':
          description: Tenant-scoped regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permission or inaccessible operation
    post:
      operationId: createRegion
      summary: Create a region in the active operation
      tags: [Geography Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegionInput'
      responses:
        '201':
          description: Region created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '400':
          description: Domain rule rejected the request
        '401':
          description: Authentication required
        '403':
          description: Insufficient permission
        '422':
          description: Validation failed

  /api/v1/admin/geography/regions/{id}:
    get:
      operationId: getRegion
      summary: Get a region in the active operation
      tags: [Geography Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Region
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '404':
          description: Region not found
    put:
      operationId: updateRegion
      summary: Update mutable region fields
      tags: [Geography Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any mutable subset of CreateRegionInput
              additionalProperties: true
      responses:
        '200':
          description: Region updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '400':
          description: Domain rule rejected the request
        '404':
          description: Region not found
        '422':
          description: Validation failed

  /api/v1/admin/geography/cities:
    get:
      operationId: listCities
      summary: List cities in the active operation
      tags: [Geography Admin]
      parameters:
        - in: query
          name: region_id
          schema:
            type: integer
        - in: query
          name: include_inactive
          schema:
            type: boolean
      responses:
        '200':
          description: Tenant-scoped cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
    post:
      operationId: createCity
      summary: Create a city in the active operation
      tags: [Geography Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCityInput'
      responses:
        '201':
          description: City created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          description: Invalid timezone, coordinates, region, or uniqueness rule
        '422':
          description: Validation failed

  /api/v1/admin/geography/cities/{id}:
    get:
      operationId: getCity
      summary: Get a city in the active operation
      tags: [Geography Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: City
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: City not found
    put:
      operationId: updateCity
      summary: Update mutable city fields
      tags: [Geography Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any mutable subset of CreateCityInput
              additionalProperties: true
      responses:
        '200':
          description: City updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          description: Domain rule rejected the request
        '404':
          description: City not found
        '422':
          description: Validation failed

  /api/v1/admin/taxonomy/families:
    get:
      operationId: listCategoryFamilies
      summary: List category families in the active operation
      tags: [Taxonomy Admin]
      responses:
        '200':
          description: Tenant-scoped category families
          content:
            application/json:
              schema:
                type: array
                items:
