        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

  /api/v1/me/benefits/redemptions/{receiptCode}:
    get:
      operationId: getMyBenefitRedemptionReceipt
      summary: Get one consumer redemption receipt
      description: Returns a receipt only when it belongs to the authenticated consumer in the active operation; ownership mismatches are hidden as 404.
      tags: [Benefits]
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: receiptCode
          in: path
          required: true
          description: Canonical receipt code. Malformed values are hidden as 404 before persistence lookup.
          schema:
            $ref: '#/components/schemas/BenefitReceiptCode'
      responses:
        '200':
          description: Consumer redemption receipt
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
