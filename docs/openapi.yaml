      description: Resolves the public operation from the trusted hostname and returns category counts from the published catalog projection.
      tags: [Catalog]
      security: []
      parameters:
        - name: citySlug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: City identity and discoverable category projections
          content:
