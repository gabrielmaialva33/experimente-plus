          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: establishment_id
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Aggregated discovery metrics for the requested organization and period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAnalyticsDashboard'
        '400':
          description: Invalid date range
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Organization or scoped establishment not found
        '422':
          description: Query validation failed

  /api/v1/admin/analytics/searches/no-results:
