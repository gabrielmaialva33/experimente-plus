      summary: List redemption history visible to the partner actor
      description: |
        Returns redemptions only for organizations where the actor has read capability. Platform
        administrators may read the active operation; a platform moderator without an active
        organization membership receives no partner access. This first contract is not paginated.
      tags: [Benefits]
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Policy-scoped partner redemption history
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitRedemptionHistory'
        '400':
          $ref: '#/components/responses/PrivateBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

  /api/v1/benefit-redemptions/{receiptCode}:
    get:
      operationId: getPartnerBenefitRedemptionReceipt
      summary: Get one redemption receipt visible to the partner actor
      description: Returns a receipt only inside the active operation and owning organization policy boundary. Inaccessible receipts are hidden as 404.
      tags: [Benefits]
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: receiptCode
          in: path
          required: true
          description: Canonical receipt code. Malformed values are hidden as 404 before persistence lookup.
          schema:
            $ref: '#/components/schemas/BenefitReceiptCode'
      responses:
        '200':
          description: Policy-scoped partner redemption receipt
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitRedemptionReceipt'
        '400':
          $ref: '#/components/responses/PrivateBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '404':
          $ref: '#/components/responses/PrivateRedemptionReceiptNotFoundError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      summary: Get current user permissions
      description: Retrieve the permissions of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      example: 'users.create'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/roles:
    get:
      operationId: getMyRoles
      summary: Get current user roles
      description: Retrieve the roles of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/sessions/sign-up:
    post:
      operationId: signUp
      summary: User registration
      description: Creates a user after explicit acceptance of the current Terms of Use and Privacy Policy, assigns the default role, optionally creates a personal workspace according to `REGISTRATION_WORKSPACE_MODE`, and returns tenant-scoped API tokens. Acceptance is required at the request boundary; this version does not claim to persist versioned legal evidence. Email delivery failure does not roll back the account.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - password_confirmation
                - terms_accepted
              properties:
                full_name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  format: email
                  example: 'john@example.com'
                username:
                  type: string
                  example: 'johndoe'
                  description: Optional username
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: 'password123'
                password_confirmation:
                  type: string
                  format: password
                  example: 'password123'
                terms_accepted:
                  type: boolean
                  enum: [true]
                  description: Must be true after the user reads the current Terms of Use and Privacy Policy.
      responses:
        '201':
          description: Registration successful
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            Pragma:
              $ref: '#/components/headers/PrivatePragma'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/AuthRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/PrivateMalformedJsonError'
        '422':
          $ref: '#/components/responses/PrivateValidationError'
        '429':
          $ref: '#/components/responses/PrivateAuthRateLimitError'

  /api/v1/verify-email:
    get:
      operationId: verifyEmail
      summary: Verify user email
      description: Verify a user's email address using a token from the verification link.
      tags:
        - Authentication
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The email verification token
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: The verification token expired or its email is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
              examples:
                expired:
                  value:
                    status: 400
                    message: Verification token has expired. Please request a new one.
                alreadyVerified:
                  value:
                    status: 400
                    message: Email already verified
        '404':
          description: No user has the supplied verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
              example:
                status: 404
                message: Invalid verification token

  /api/v1/resend-verification-email:
    post:
      operationId: resendVerificationEmail
      summary: Resend verification email
      description: Resends the email verification link to the authenticated user.
      tags:
        - Authentication
      responses:
        '200':
          description: Verification email sent successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Verification email could not be delivered

  /api/v1/tenants:
    post:
      operationId: createTenant
      summary: Create a workspace
      description: Atomically consumes a refresh credential bound to the bearer user, creates an active workspace, adds that user as owner, and returns one child token pair carrying the new tenant id. Requires `tenants.create`. A failed validation, permission check, credential check, or transaction does not persist the workspace or consume the refresh credential. Clients must serialize this operation with every other refresh-token rotation.
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Workspace created
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            Pragma:
              $ref: '#/components/headers/PrivatePragma'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                type: object
                required: [tenant, auth]
                additionalProperties: false
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
                  auth:
                    $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/PrivateMalformedJsonError'
        '401':
          $ref: '#/components/responses/PrivateSessionMutationUnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '422':
          $ref: '#/components/responses/PrivateValidationError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

