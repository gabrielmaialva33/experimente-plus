      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uid
                - password
              properties:
                uid:
                  type: string
                  description: Email or username
                  example: 'john@example.com'
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: 'password123'
      responses:
        '200':
          description: Login successful
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            Pragma:
              $ref: '#/components/headers/PrivatePragma'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/AuthRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials, or a syntactically malformed JSON request body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCacheControl'
            Pragma:
              $ref: '#/components/headers/PrivatePragma'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ApiMessageError'
              examples:
                invalidCredentials:
                  value:
                    errors:
                      - message: Invalid credentials
                malformedJson:
                  value:
                    status: 400
                    message: Malformed JSON request body
        '422':
          $ref: '#/components/responses/PrivateValidationError'
        '429':
          $ref: '#/components/responses/PrivateAuthRateLimitError'

