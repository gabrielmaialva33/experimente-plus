              $ref: '#/components/headers/PrivateCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/PrivateBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

  /api/v1/me/benefits/presentations:
    post:
      operationId: createBenefitPresentation
      summary: Create a temporary benefit presentation
      description: |
        Creates a signed presentation valid for five minutes after rechecking ownership,
        availability, schedule and use limits. The server chooses the canonical validation origin;
        clients cannot provide it. The token and validation URL are sensitive and must not be logged.
      tags: [Benefits]
      parameters:
