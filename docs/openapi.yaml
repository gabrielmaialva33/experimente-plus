          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Media association removed
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Media not found in the editable revision

