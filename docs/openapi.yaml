          description: Rejected terminal revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Revision is not pending_review
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Revision not found
        '422':
          description: Reason validation failed

  /api/v1/admin/establishments/{id}/suspend:
    post:
      operationId: suspendEstablishment
      summary: Suspend an establishment without deleting its publication history
      description: Removes the establishment from public discovery while preserving published_revision_id, media and immutable history. Requires a global administrator.
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
