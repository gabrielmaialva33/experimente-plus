            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitPresentation'
        '400':
          $ref: '#/components/responses/PrivateBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '404':
          $ref: '#/components/responses/PrivateNotFoundError'
        '422':
