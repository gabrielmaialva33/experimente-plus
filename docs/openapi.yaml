  /api/v1/files:
    get:
      operationId: listFiles
      summary: List files in the active workspace
      description: Returns a paginated tenant-scoped file list. Requires `files.list` and an active workspace.
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/pageParam'
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Workspace file list
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      perPage:
                        type: integer
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      firstPage:
                        type: integer
                      nextPageUrl:
                        type: [string, 'null']
                      previousPageUrl:
                        type: [string, 'null']
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileListItem'
        '400':
          description: An active workspace is required or the tenant header is malformed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/files/upload:
    post:
      operationId: uploadFile
      summary: Upload file
      description: |
        Upload a file to the server. Files are automatically categorized based on their type.

        **File constraints:**
        - Maximum size: 10MB
        - Allowed extensions: jpeg, jpg, png, pdf, doc, docx, txt, csv, xls, xlsx, mp3, mp4, zip

        **Categories:**
        - `image`: jpeg, jpg, png
        - `document`: pdf, doc, docx, txt
        - `video`: mp4
        - `audio`: mp3
        - `file`: csv, xls, xlsx, zip, and others
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: File validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errors:
                  - message: 'File size should be less than 10MB'
                    field: 'file'
                    rule: 'size'

