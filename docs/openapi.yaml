              $ref: '#/components/headers/PrivateRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PrivateReferrerPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                type: object
                required: [tenant, auth]
                additionalProperties: false
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
                  auth:
                    $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/PrivateMalformedJsonError'
        '401':
          $ref: '#/components/responses/PrivateSessionMutationUnauthorizedError'
        '403':
          $ref: '#/components/responses/PrivateForbiddenError'
        '422':
          $ref: '#/components/responses/PrivateValidationError'
        '429':
          $ref: '#/components/responses/PrivateRateLimitError'

