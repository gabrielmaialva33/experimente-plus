          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: city_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated no-result search aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSearchTermsPage'
        '400':
          description: Invalid date range
        '401':
          description: Authentication required
        '403':
          description: Platform administrator capability required
        '404':
          description: Requested city not found in the active operation
        '422':
          description: Query validation failed
  /api/v1/establishments/{id}/review:
    get:
      operationId: getEstablishmentReviewStatus
      summary: Read the current establishment review state
      description: Returns the open revision when one exists, otherwise the published revision, together with completeness, structured review issues and immutable workflow events.
