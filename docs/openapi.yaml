            type: object
            additionalProperties: true
        attributes:
          type: array
          items:
            type: object
            additionalProperties: true
        opening_hours:
          type: object
          additionalProperties: true
        media:
          type: array
          items:
            type: object
            additionalProperties: true
        cover:
          type: object
          additionalProperties: true
        is_sponsored:
          type: boolean
        published_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogHistoricalProjection:
      type: object
      required: [slug, name, city, business_status, historical, message, published_at, updated_at]
      properties:
        slug:
          type: string
        name:
          type: string
        city:
          type: object
          additionalProperties: true
        business_status:
          type: string
          const: permanently_closed
        historical:
          type: boolean
          const: true
        message:
          type: string
        published_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnalyticsEventInput:
      type: object
      required: [event_id, event_type, city_slug]
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - catalog_impression
            - establishment_view
            - route_click
            - whatsapp_click
            - phone_click
            - website_click
            - share_click
            - search_without_results
        city_slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        establishment_slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        category_slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        search_term:
          type: string
          minLength: 1
          maxLength: 160

    AnalyticsEventsRequest:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/AnalyticsEventInput'

    AnalyticsEventsAccepted:
      type: object
      required: [accepted, recorded, deduplicated, suppressed]
      properties:
        accepted:
          type: integer
          minimum: 1
          maximum: 20
        recorded:
          type: integer
          minimum: 0
          maximum: 20
        deduplicated:
          type: integer
          minimum: 0
          maximum: 20
        suppressed:
          type: integer
          minimum: 0
          maximum: 20
          description: Events intentionally ignored because the request expressed DNT or Global Privacy Control.

    AnalyticsMetricTotal:
      type: object
      required: [event_type, event_count, unique_sessions]
      properties:
        event_type:
          type: string
        event_count:
          type: integer
          minimum: 0
        unique_sessions:
          type: integer
          minimum: 0

    AnalyticsMetricDay:
      type: object
      required: [date, impressions, views, conversions, unique_sessions]
      properties:
        date:
          type: string
          format: date
        impressions:
          type: integer
          minimum: 0
        views:
          type: integer
          minimum: 0
        conversions:
          type: integer
          minimum: 0
        unique_sessions:
          type: integer
          minimum: 0

    AnalyticsEstablishmentSummary:
      type: object
      required:
        - establishment_id
        - public_name
        - slug
        - impressions
        - views
        - conversions
        - unique_sessions
      properties:
        establishment_id:
          type: integer
          minimum: 1
        public_name:
          type: string
        slug:
          type: string
        impressions:
          type: integer
          minimum: 0
        views:
          type: integer
          minimum: 0
        conversions:
          type: integer
          minimum: 0
        unique_sessions:
          type: integer
          minimum: 0

    OrganizationAnalyticsDashboard:
      type: object
      required: [organization_id, from, to, totals, timeseries, establishments]
      properties:
        organization_id:
          type: integer
          minimum: 1
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsMetricTotal'
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsMetricDay'
        establishments:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEstablishmentSummary'

    AnalyticsSearchTerm:
      type: object
      required: [date, city_id, city_name, term, category_slug, searches, unique_sessions]
      properties:
        date:
          type: string
          format: date
        city_id:
          type: integer
          minimum: 1
        city_name:
          type: string
        term:
          type: string
          description: Privacy-redacted search term. Email addresses and phone numbers are never returned.
        category_slug:
          type: [string, 'null']
        searches:
          type: integer
          minimum: 0
        unique_sessions:
          type: integer
          minimum: 0

    AnalyticsSearchTermsPage:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [total, page, per_page, last_page]
          properties:
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
              maximum: 100
            last_page:
              type: integer
              minimum: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSearchTerm'

    PilotFeedback:
      type: object
      required:
        - id
        - tenant_id
        - user_id
        - context
        - rating
        - message
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        tenant_id:
          type: integer
          minimum: 1
        user_id:
          type: integer
          minimum: 1
        organization_id:
          type: [integer, 'null']
          minimum: 1
        establishment_id:
          type: [integer, 'null']
          minimum: 1
        context:
          type: string
          enum: [general, onboarding, organization, establishment, catalog, analytics, moderation]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        message:
          type: string
          minLength: 3
          maxLength: 4000
        status:
          type: string
          enum: [new, in_review, resolved, dismissed]
        reviewed_by:
          type: [integer, 'null']
          minimum: 1
        reviewed_at:
          type: [string, 'null']
          format: date-time
        internal_notes:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        author:
          type: [object, 'null']
          additionalProperties: true
        reviewer:
          type: [object, 'null']
          additionalProperties: true
        organization:
          type: [object, 'null']
          additionalProperties: true
        establishment:
          type: [object, 'null']
          additionalProperties: true

    CreatePilotFeedbackRequest:
      type: object
      required: [context, rating, message]
      additionalProperties: false
      properties:
        context:
          type: string
          enum: [general, onboarding, organization, establishment, catalog, analytics, moderation]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        message:
          type: string
          minLength: 3
          maxLength: 4000
        organization_id:
          type: integer
          minimum: 1
        establishment_id:
          type: integer
          minimum: 1

    ReviewPilotFeedbackRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [in_review, resolved, dismissed]
        internal_notes:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000

    PilotFeedbackPage:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          additionalProperties: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PilotFeedback'

  parameters:
    TenantHeader:
      name: x-tenant-id
      in: header
      required: true
      description: Identificador do tenant ativo para operações privadas.
      schema:
        type: integer
        minimum: 1

    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    perPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page

    sortByParam:
      name: sort_by
      in: query
      schema:
        type: string
        default: id
      description: Field to sort by

    orderParam:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order

    searchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search term for filtering results

    tenantHeader:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
      description: Optional active operation override. Membership and active status are always validated.

  headers:
    PrivateCacheControl:
      description: Prevents storage in shared or device HTTP caches.
      schema:
        type: string
        const: private, no-store

    PrivateRobotsTag:
      description: Prevents indexing of private API representations.
      schema:
        type: string
        const: noindex, nofollow

    PrivateReferrerPolicy:
      description: Prevents a presentation token in a validation URL from leaking as a referrer.
      schema:
        type: string
        const: no-referrer

    PrivatePragma:
      description: Legacy cache directive for clients and intermediaries that do not fully honor Cache-Control.
      schema:
        type: string
        const: no-cache

    AuthRateLimitLimit:
      description: Maximum authentication attempts allowed in the current fifteen-minute window.
      schema:
        type: integer
        const: 5

    GuestRateLimitLimit:
      description: Maximum unauthenticated API requests allowed in the current one-minute window per IP address.
      schema:
        type: integer
        const: 10

    RateLimitLimit:
      description: Maximum authenticated requests allowed in the current one-minute window.
      schema:
        type: integer
        const: 100

    RateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema:
        type: integer
        minimum: 0

    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        minimum: 0

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Unauthorized'

    PrivateSessionMutationUnauthorizedError:
      description: The bearer credential is absent or invalid, or the submitted refresh credential is invalid, expired, revoked, replayed, or belongs to another user. Refresh failures intentionally share one generic message.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/ApiMessageError'
          examples:
            refreshCredential:
              value:
                status: 401
                message: Invalid or expired refresh token

    PrivateMalformedJsonError:
      description: The request declared `application/json`, but its body is not syntactically valid JSON. The response never echoes request contents or credentials.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessageError'
          example:
            status: 400
            message: Malformed JSON request body

    PrivateAuthRateLimitError:
      description: Authentication throttle exceeded (5 attempts per 15 minutes for the IP and login identifier).
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
        X-RateLimit-Limit:
          $ref: '#/components/headers/AuthRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiRateLimitError'

    PrivateGuestRateLimitError:
      description: Unauthenticated API throttle exceeded (10 requests per minute per IP address).
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
        X-RateLimit-Limit:
          $ref: '#/components/headers/GuestRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiRateLimitError'

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Forbidden'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Resource not found'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PrivateBadRequestError:
      description: The active operation or benefit state makes this request invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessageError'
          example:
            status: 400
            message: An active tenant is required for this operation

    PrivateBenefitRedemptionBadRequest:
      description: A structurally valid presentation is invalid or expired, or the current benefit, access, edition, offer, establishment, schedule, or redemption limit no longer permits redemption. Presentation failures use one generic message; current domain-state failures preserve their actionable message.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessageError'
          examples:
            invalidPresentation:
              summary: Invalid, tampered, or expired presentation
              value:
                status: 400
                message: Esta apresentação é inválida ou expirou. Peça ao cliente para gerar uma nova apresentação e tente novamente.
            benefitNotRedeemable:
              summary: Benefit state changed after presentation
              value:
                status: 400
                message: Benefit offer is not active

    PrivateForbiddenError:
      description: The active operation or organization policy denies access.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessageError'
          example:
            status: 403
            message: The requested tenant is inactive or inaccessible

    PrivateNotFoundError:
      description: The resource is absent or intentionally hidden by a tenant or ownership boundary.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessageError'
          example:
            status: 404
            message: Benefit not found

    PrivateRedemptionReceiptNotFoundError:
      description: The receipt is absent, malformed, or intentionally hidden by a tenant, organization, or ownership boundary.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessageError'
          example:
            status: 404
            message: Redemption receipt not found

    PrivateValidationError:
      description: VineJS request validation failed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PrivateRateLimitError:
      description: Authenticated API throttle exceeded (100 requests per minute per user).
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PrivateRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PrivateReferrerPolicy'
        Pragma:
          $ref: '#/components/headers/PrivatePragma'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiRateLimitError'

tags:
  - name: Catalog
    description: Public regional discovery backed by the published catalog projection.
  - name: Health
    description: System health monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Tenants
    description: Tenant membership and active workspace operations
  - name: Roles
    description: Role management operations (admin only)
  - name: Files
    description: File upload and management
  - name: Profile
    description: Current user profile operations
  - name: Benefits
    description: Private wallet, temporary presentation, policy-scoped redemption, history and receipts.
  - name: Permissions
    description: Permission management operations (admin only)
  - name: Organizations
    description: Tenant-scoped companies, memberships, invitations, claims and administrative workflow.
  - name: Establishments
    description: Stable units, revisioned public content, schedules, attributes, and completeness

  - name: Media
    description: Versioned establishment images, cover selection, ordering and moderation.
  - name: Establishment Review
    description: Submission, structured corrections, moderation, atomic publication and lifecycle controls.

  - name: Analytics
    description: Privacy-preserving discovery events, partner aggregates and platform search diagnostics.

  - name: Pilot Feedback
    description: Authenticated pilot observations and the private administrative triage queue.

paths:
  /api/v1/pilot-feedback:
    post:
      operationId: createPilotFeedback
      summary: Submit structured feedback about the regional pilot
      description: The server validates tenant, organization membership and establishment ownership before associating a target.
      tags: [Pilot Feedback]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePilotFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotFeedback'
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Organization or establishment target not visible to the actor
        '422':
          description: Validation failed

  /api/v1/admin/pilot-feedback:
    get:
      operationId: listPilotFeedback
      summary: List the tenant-scoped pilot feedback queue
      description: Reserved for Administrator and Root. Moderators do not receive commercial pilot feedback access automatically.
      tags: [Pilot Feedback]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - in: query
          name: status
          schema:
            type: string
            enum: [new, in_review, resolved, dismissed]
        - in: query
          name: context
          schema:
            type: string
            enum: [general, onboarding, organization, establishment, catalog, analytics, moderation]
        - in: query
          name: organization_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: establishment_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated feedback queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotFeedbackPage'
        '401':
          description: Authentication required
        '403':
          description: Administrator or Root role required
        '422':
          description: Invalid query parameters

  /api/v1/admin/pilot-feedback/{id}:
    patch:
      operationId: reviewPilotFeedback
      summary: Update the administrative triage state of pilot feedback
      tags: [Pilot Feedback]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPilotFeedbackRequest'
      responses:
        '200':
          description: Feedback reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotFeedback'
        '401':
          description: Authentication required
        '403':
          description: Administrator or Root role required
        '404':
          description: Feedback not found in the active tenant
        '422':
          description: Validation failed
  /api/v1/analytics/events:
    post:
      operationId: ingestDiscoveryAnalyticsEvents
      summary: Record a small batch of privacy-safe discovery events
      description: Resolves the public operation from the hostname, validates targets against the published catalog, deduplicates events and updates daily aggregates. Raw IP addresses, user agents and authenticated user IDs are not stored.
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventsRequest'
      responses:
        '202':
          description: Events accepted for the privacy-preserving analytics pipeline
          headers:
            Set-Cookie:
              description: Encrypted first-party anonymous analytics session cookie when absent.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventsAccepted'
        '400':
          description: Event semantics do not match the event type
        '404':
          description: Public operation, city, category or published establishment was not found
        '422':
          description: Payload validation failed
        '429':
          description: Public analytics rate limit exceeded

  /go/{citySlug}/{establishmentSlug}/{action}:
    get:
      operationId: redirectTrackedEstablishmentAction
      summary: Redirect to an allowlisted establishment action
      description: Derives the destination exclusively from the published catalog and records the corresponding action event. Arbitrary redirect destinations are never accepted.
      tags: [Analytics]
      parameters:
        - in: path
          name: citySlug
          required: true
          schema:
            type: string
        - in: path
          name: establishmentSlug
          required: true
          schema:
            type: string
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [route, whatsapp, phone, website]
      responses:
        '302':
          description: Redirect to Google Maps, WhatsApp, telephone or the published HTTP(S) website
          headers:
            Location:
              required: true
              schema:
                type: string
        '404':
          description: Establishment or requested action is unavailable
        '429':
          description: Public action rate limit exceeded

  /api/v1/organizations/{organizationId}/analytics:
    get:
      operationId: getOrganizationDiscoveryAnalytics
