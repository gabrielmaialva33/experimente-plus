      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Review state visible to an authorized organization member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentReviewStatus'
        '401':
          description: Authentication required
        '403':
          description: Permission or organization capability denied
        '404':
          description: Establishment not found in the tenant or membership scope

  /api/v1/establishments/{id}/revisions:
    post:
      operationId: createNextEstablishmentRevision
      summary: Clone a terminal establishment revision into a new draft
      description: Creates the next version transactionally and copies address, categories, typed attributes, hours, special dates and media associations without changing the published revision.
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstablishmentRevisionRequest'
      responses:
        '201':
          description: New draft created from the selected source revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstablishmentRevisionResponse'
        '400':
          description: An open revision exists or the selected source cannot be cloned
        '401':
          description: Authentication required
        '403':
          description: Organization management capability required
        '404':
          description: Establishment or source revision not found
        '422':
          description: Request validation failed

  /api/v1/establishments/{id}/submit:
    post:
      operationId: submitEstablishmentRevision
      summary: Submit the editable establishment revision for moderation
      description: Recomputes the submission gate under lock. Eligible drafts and changes_requested revisions become pending_review and are frozen. Ineligible revisions remain editable and return actionable diagnostics.
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Revision submitted and frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentSubmissionResult'
        '401':
          description: Authentication required
        '403':
          description: Owner, admin or editor membership required
        '404':
          description: Establishment or editable revision not found
        '422':
          description: Submission gate failed; response includes blocking issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentSubmissionResult'

  /api/v1/admin/establishment-revisions:
    get:
      operationId: listEstablishmentReviewQueue
      summary: List pending establishment revisions for moderation
      description: Returns only pending_review revisions from the active tenant, ordered by submission time. Requires global moderator capability and establishments.list.
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: query
          name: organization_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: city_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated tenant-scoped moderation queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentReviewQueuePage'
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '422':
          description: Query validation failed

  /api/v1/admin/establishment-revisions/{id}:
    get:
      operationId: getEstablishmentRevisionModerationDetail
      summary: Read a revision, publication gate, issues and workflow history
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Moderation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentModerationDetail'
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Revision not found in the active tenant

  /api/v1/admin/establishment-revisions/{id}/approve:
    post:
      operationId: approveAndPublishEstablishmentRevision
      summary: Approve a revision and atomically publish it
      description: Recomputes the publication gate under lock. On success, the revision becomes approved and the establishment published_revision_id changes in the same transaction.
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishmentModerationReasonRequest'
      responses:
        '200':
          description: Revision approved and published atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentApprovalResult'
        '400':
          description: Revision is not pending_review or establishment lifecycle disallows moderation
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Revision or establishment not found
        '422':
          description: Publication gate failed; the published pointer was not changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentApprovalResult'

  /api/v1/admin/establishment-revisions/{id}/request-changes:
    post:
      operationId: requestEstablishmentRevisionChanges
      summary: Return a pending revision to the partner with structured issues
      description: Moves pending_review to changes_requested and stores unique actionable issues while preserving the immutable decision history.
      tags: [Establishment Review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEstablishmentChangesRequest'
      responses:
        '200':
          description: Revision returned for correction
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Revision is not pending_review or issue pairs are duplicated
        '401':
          description: Authentication required
        '403':
          description: Platform moderator capability required
        '404':
          description: Revision not found
        '422':
          description: Reason or issue validation failed

  /api/v1/admin/establishment-revisions/{id}/reject:
    post:
      operationId: rejectEstablishmentRevision
      summary: Reject a pending revision with a required reason
      description: The revision becomes terminal and the currently published revision remains unchanged.
