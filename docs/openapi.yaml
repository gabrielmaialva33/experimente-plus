openapi: 3.1.0
info:
  title: Experimente+ API
  version: 0.1.0
  description: |
    ## Experimente+ API

    API da plataforma regional Experimente+, construída com AdonisJS 7, React e Inertia. O contrato cobre a fundação compartilhada e os domínios operacionais já implementados: identidade, autorização, operações, geografia, taxonomia, organizações, unidades revisionadas, mídia, moderação, catálogo público, benefícios, analytics e feedback privado do piloto.

    ### Foundation capabilities

    - **Access JWTs**: Short-lived signed bearer tokens for API requests
    - **Opaque Refresh Tokens**: Rotated on every use and persisted only as HMAC hashes
    - **Global RBAC**: Roles, direct permissions, inheritance, and cache invalidation
    - **Tenant Operations**: Verified active-operation context, membership-aware selection, and operation creation
    - **File Management**: Tenant-scoped upload, listing, and owner-aware deletion across multiple storage drivers
    - **Account Lifecycle**: Email verification, single-use password reset, and anonymized self-deletion
    - **Health Monitoring**: Public readiness and dependency checks
    - **Organization Workflows**: Tenant-safe memberships, invitations, claims and administrative review
    - **Revisioned Establishments**: Typed effective attributes, media composition, moderation and atomic publication
    - **Public Discovery**: Host-resolved city/category catalog, search and privacy-preserving analytics
    - **Mobile Client**: Consumer-first context, profile, wallet, temporary benefit presentation and policy-scoped partner redemption

    ## Authentication

    1. **Login**: POST to `/api/v1/sessions/sign-in` with your credentials
    2. **Get Tokens**: Extract `access_token` and `refresh_token` from `auth`
    3. **Use Access Token**: Include `Authorization: Bearer <access_token>`
    4. **Rotate Tokens**: POST the opaque refresh token to `/api/v1/sessions/refresh`; creating or switching an authenticated operation also consumes the current refresh token

    ### Token Management

    - **API Access Token Lifetime**: 15 minutes
    - **Web Cookie Lifetime**: 1 hour
    - **Refresh Token Lifetime**: 3 days
    - **Access Token Format**: JWT with `token_use=access`
    - **Refresh Token Format**: 32 random bytes encoded as 43 canonical unpadded base64url characters; it is not a JWT and whitespace is never normalized
    - **Rotation Serialization**: Refresh, operation creation, and operation switching share one single-use token chain and must be serialized by clients

    ## API Conventions

    ### Request Format
    - **Content-Type**: `application/json` for all requests (except file uploads). Credential-bearing session mutations and tenant creation/switching require this exact base media type; parameters such as `charset=utf-8` are accepted, while JSON-family aliases, forms, multipart, text, and binary bodies are rejected with `422`. Syntactically malformed canonical JSON returns the sanitized `400` response without echoing request data.
    - **Pagination**: Use `?page=1&per_page=10` query parameters
    - **Sorting**: Use `?sort_by=field&order=asc` or `?sort_by=field&order=desc`
    - **Searching**: Use `?search=term` for text search

    ### Response Format
    - **Success**: HTTP 2xx with JSON body
    - **Errors**: HTTP 4xx/5xx with endpoint-specific documented envelopes; legacy formats are not yet globally uniform
    - **Timestamps**: ISO 8601 format
    - **Database Fields**: snake_case naming convention

    ### Common Headers
    ```
    Authorization: Bearer <token>
    Content-Type: application/json
    Accept: application/json
    ```

  contact:
    name: Experimente+ Engineering
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:3333
    description: Local development server
  - url: https://api.example.com
    description: Production placeholder (replace when the public domain is defined)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access JWT. Opaque refresh tokens are never accepted here.

  schemas:
    Region:
      type: object
      required: [id, tenant_id, name, slug, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    City:
      type: object
      required:
        [
          id,
          tenant_id,
          region_id,
          name,
          slug,
          state_code,
          country_code,
          timezone,
          sort_order,
          is_active,
        ]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        region_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        state_code:
          type: string
          minLength: 2
          maxLength: 2
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        ibge_code:
          type: [string, 'null']
        timezone:
          type: string
          example: America/Sao_Paulo
        latitude:
          type: [number, 'null']
          format: double
        longitude:
          type: [number, 'null']
          format: double
        sort_order:
          type: integer
        is_active:
          type: boolean
        region:
          oneOf:
            - $ref: '#/components/schemas/Region'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryFamily:
      type: object
      required: [id, tenant_id, name, slug, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, tenant_id, family_id, name, slug, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        family_id:
          type: integer
        parent_id:
          type: [integer, 'null']
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        attribute_definitions:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttributeDefinition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryAttributeDefinition:
      type: object
      required:
        [
          id,
          tenant_id,
          category_id,
          key,
          name,
          data_type,
          is_required,
          is_filterable,
          is_public,
          applies_to_descendants,
          sort_order,
          is_active,
        ]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        category_id:
          type: integer
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        data_type:
          type: string
          enum: [text, long_text, boolean, integer, decimal, single_select, multi_select, url]
        unit:
          type: [string, 'null']
        validation_rules:
          type: object
          additionalProperties: true
        is_required:
          type: boolean
        is_filterable:
          type: boolean
        is_public:
          type: boolean
        applies_to_descendants:
          type: boolean
        sort_order:
          type: integer
        is_active:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttributeOption'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryAttributeOption:
      type: object
      required: [id, tenant_id, attribute_definition_id, label, value, sort_order, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        attribute_definition_id:
          type: integer
        label:
          type: string
        value:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRegionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCityInput:
      type: object
      required: [region_id, name, state_code, timezone]
      properties:
        region_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        state_code:
          type: string
        country_code:
          type: string
          default: BR
        ibge_code:
          type: [string, 'null']
        timezone:
          type: string
          example: America/Sao_Paulo
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryFamilyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryInput:
      type: object
      required: [family_id, name]
      properties:
        family_id:
          type: integer
        parent_id:
          type: [integer, 'null']
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryAttributeDefinitionInput:
      type: object
      required: [category_id, key, name, data_type]
      properties:
        category_id:
          type: integer
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        data_type:
          type: string
          enum: [text, long_text, boolean, integer, decimal, single_select, multi_select, url]
        unit:
          type: [string, 'null']
        is_required:
          type: boolean
        is_filterable:
          type: boolean
        is_public:
          type: boolean
        applies_to_descendants:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CreateCategoryAttributeOptionInput:
      type: object
      required: [attribute_definition_id, label]
      properties:
        attribute_definition_id:
          type: integer
        label:
          type: string
        value:
          type: string
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        username:
          type: [string, 'null']
          example: 'johndoe'
        email_verified:
          type: boolean
          example: true
        email_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'User'
        description:
          type: string
          example: 'Regular user role'
        slug:
          type: string
          enum: [root, admin, user, guest, editor]
          example: 'user'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [auth]
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        email_verification_sent:
          type: boolean
          description: Present on sign-up responses; false means the account was created but email delivery failed.

    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: Short-lived JWT accepted by bearer-authenticated endpoints.
          example: '<access-token>'
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        token_type:
          type: string
          const: Bearer
          description: Authentication scheme used in the Authorization header.
        expires_in:
          type: integer
          const: 900
          description: Access-token lifetime in seconds.
        refresh_expires_in:
          type: integer
          const: 259200
          description: Refresh-token lifetime in seconds.

    MobileUser:
      type: object
      required: [id, full_name, email, username, email_verified, email_verified_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: [string, 'null']
        email_verified:
          type: boolean
        email_verified_at:
          type: [string, 'null']
          format: date-time

    MobileOperation:
      type: object
      required: [id, name, slug]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string

    MobileOperationMembership:
      type: object
      required: [id, name, slug, role, is_current]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string
        role:
          type: string
          description: Membership role inside the operation.
        is_current:
          type: boolean

    MobileCapabilities:
      type: object
      required: [consumer, partner, platform_access]
      additionalProperties: false
      properties:
        consumer:
          type: object
          required: [wallet]
          additionalProperties: false
          properties:
            wallet:
              type: object
              required: [read]
              additionalProperties: false
              properties:
                read:
                  type: boolean
                  const: true
        partner:
          type: object
          required: [enabled, redemptions]
          additionalProperties: false
          description: |
            `enabled` means the actor has an active organization membership; it is not a
            global role. Render redemption actions from `redemptions.read` and
            `redemptions.validate`, because operation-wide platform staff may receive a
            capability while `enabled` remains false.
          properties:
            enabled:
              type: boolean
            redemptions:
              type: object
              required: [read, validate]
              additionalProperties: false
              properties:
                read:
                  type: boolean
                validate:
                  type: boolean
        platform_access:
          type: [string, 'null']
          enum: [platform_admin, platform_moderator, null]

    MobileContext:
      type: object
      required: [user, active_operation, operations, capabilities]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/MobileUser'
        active_operation:
          $ref: '#/components/schemas/MobileOperation'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/MobileOperationMembership'
        capabilities:
          $ref: '#/components/schemas/MobileCapabilities'

    UpdateMobileProfileRequest:
      type: object
      additionalProperties: false
      description: Partial self-service update. The runtime also strips unknown properties.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 80

    UpdateMobileProfileResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/MobileUser'

    WalletSummary:
      type: object
      required: [passes, benefits, available, upcoming, redeemed]
      additionalProperties: false
      properties:
        passes:
          type: integer
          minimum: 0
        benefits:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        upcoming:
          type: integer
          minimum: 0
        redeemed:
          type: integer
          minimum: 0

    BenefitReceiptCode:
      type: string
      minLength: 20
      maxLength: 20
      pattern: '^EXP-[0-9A-F]{16}$'
      description: Canonical opaque redemption receipt code.

    WalletLatestRedemption:
      type: object
      required: [id, receipt_code, redeemed_at]
      additionalProperties: false
      properties:
        id:
          type: string
        receipt_code:
          $ref: '#/components/schemas/BenefitReceiptCode'
        redeemed_at:
          type: string
          format: date-time

    WalletBenefit:
      type: object
      required:
        [
          key,
          access_id,
          offer_id,
          availability,
          title,
          description,
          benefit_type,
          discount_percentage,
          discount_amount_cents,
          terms,
          available_weekdays_mask,
          daily_start_time,
          daily_end_time,
          reservation_required,
          on_premise_only,
          minimum_party_size,
          max_redemptions_per_access,
          redemption_count,
          remaining_redemptions,
          latest_redemption,
          establishment,
        ]
      additionalProperties: false
      properties:
        key:
          type: string
        access_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        offer_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        availability:
          type: string
          enum: [available, upcoming, outside_schedule, paused, expired, revoked, redeemed]
        title:
          type: string
        description:
          type: string
        benefit_type:
          type: string
          enum: [buy_one_get_one, percentage, fixed_amount, complimentary_item, custom]
        discount_percentage:
          type: [number, 'null']
        discount_amount_cents:
          type: [integer, 'null']
        terms:
          type: [string, 'null']
        available_weekdays_mask:
          type: integer
        daily_start_time:
          type: [string, 'null']
        daily_end_time:
          type: [string, 'null']
        reservation_required:
          type: boolean
        on_premise_only:
          type: boolean
        minimum_party_size:
          type: integer
          minimum: 1
        max_redemptions_per_access:
          type: integer
          minimum: 1
        redemption_count:
          type: integer
          minimum: 0
        remaining_redemptions:
          type: integer
          minimum: 0
        latest_redemption:
          oneOf:
            - $ref: '#/components/schemas/WalletLatestRedemption'
            - type: 'null'
        establishment:
          type: object
          required: [id, public_name, slug]
          additionalProperties: false
          properties:
            id:
              type: integer
              minimum: 1
            public_name:
              type: string
            slug:
              type: [string, 'null']

    WalletPass:
      type: object
      required: [access, edition, benefits]
      additionalProperties: false
      properties:
        access:
          type: object
          required: [id, source, status, granted_at, availability]
          additionalProperties: false
          properties:
            id:
              type: integer
              minimum: 1
            source:
              type: string
              enum: [manual, courtesy, payment, promo_code, migration]
            status:
              type: string
              enum: [active, revoked]
            granted_at:
              type: string
              format: date-time
            availability:
              type: string
              enum: [available, upcoming, outside_schedule, paused, expired, revoked, redeemed]
        edition:
          type: object
          required:
            [
              id,
              name,
              slug,
              description,
              price_cents,
              currency,
              usage_starts_at,
              usage_ends_at,
              status,
              city,
            ]
          additionalProperties: false
          properties:
            id:
              type: integer
              minimum: 1
            name:
              type: string
            slug:
              type: string
            description:
              type: [string, 'null']
            price_cents:
              type: integer
              minimum: 0
            currency:
              type: string
            usage_starts_at:
              type: string
              format: date-time
            usage_ends_at:
              type: string
              format: date-time
            status:
              type: string
              enum: [draft, published, paused, archived]
            city:
              type: object
              required: [id, name, slug, state_code, timezone]
              additionalProperties: false
              properties:
                id:
                  type: integer
                  minimum: 1
                name:
                  type: string
                slug:
                  type: string
                state_code:
                  type: string
                timezone:
                  type: string
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/WalletBenefit'

    Wallet:
      type: object
      required: [summary, passes]
      additionalProperties: false
      properties:
        summary:
          $ref: '#/components/schemas/WalletSummary'
        passes:
          type: array
          items:
            $ref: '#/components/schemas/WalletPass'

    BenefitSummary:
      type: object
      required:
        [
          access_id,
          offer_id,
          edition_id,
          edition_name,
          organization_id,
          establishment_id,
          establishment_name,
          offer_title,
          offer_description,
          terms,
          benefit_type,
          reservation_required,
          on_premise_only,
          minimum_party_size,
          max_redemptions_per_access,
          redeemed_count,
          remaining_redemptions,
        ]
      additionalProperties: false
      properties:
        access_id:
          type: integer
          minimum: 1
        offer_id:
          type: integer
          minimum: 1
        edition_id:
          type: integer
          minimum: 1
        edition_name:
          type: string
        organization_id:
          type: integer
          minimum: 1
        establishment_id:
          type: integer
          minimum: 1
        establishment_name:
          type: string
        offer_title:
          type: string
        offer_description:
          type: string
        terms:
          type: [string, 'null']
        benefit_type:
          type: string
          enum: [buy_one_get_one, percentage, fixed_amount, complimentary_item, custom]
        reservation_required:
          type: boolean
        on_premise_only:
          type: boolean
        minimum_party_size:
          type: integer
          minimum: 1
        max_redemptions_per_access:
          type: integer
          minimum: 1
        redeemed_count:
          type: integer
          minimum: 0
        remaining_redemptions:
          type: integer
          minimum: 0

    BenefitPresentationRequest:
      type: object
      description: Unknown request properties are accepted and discarded during validation.
      required: [access_id, offer_id]
      properties:
        access_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        offer_id:
          type: integer
          minimum: 1
          maximum: 2147483647

    BenefitPresentation:
      type: object
      required:
        [token, validation_url, qr_data_url, issued_at, expires_at, expires_in_seconds, benefit]
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/BenefitPresentationToken'
        validation_url:
          type: string
          format: uri
          description: Partner validation URL using the server-selected canonical origin.
        qr_data_url:
          type: string
          description: PNG QR code encoded as a data URL.
          pattern: '^data:image/png;base64,'
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expires_in_seconds:
          type: integer
          const: 300
        benefit:
          $ref: '#/components/schemas/BenefitSummary'

    BenefitPresentationToken:
      type: string
      minLength: 46
      maxLength: 512
      pattern: '^(?:(?:[A-Za-z0-9_-]{4})+|(?:[A-Za-z0-9_-]{4})*[A-Za-z0-9_-][AQgw]|(?:[A-Za-z0-9_-]{4})*[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048])\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      description: Canonical five-minute signed, unpadded base64url payload.signature token. Segment length, alphabet, and unused pad bits must survive an exact decode-encode round trip. Invalid signatures, claims, or expiry receive a generic 400. Never log or persist the raw value.

    BenefitPresentationTokenInput:
      type: string
      minLength: 46
      maxLength: 512
      pattern: '^\s*(?:(?:[A-Za-z0-9_-]{4})+|(?:[A-Za-z0-9_-]{4})*[A-Za-z0-9_-][AQgw]|(?:[A-Za-z0-9_-]{4})*[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048])\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]\s*$'
      description: HTTP input form of the presentation token. The raw field is limited to 512 characters before surrounding whitespace is removed; its normalized content must be a canonical BenefitPresentationToken. Transport grammar failures receive 422.

    BenefitPresentationTokenRequest:
      type: object
      description: Surrounding whitespace in the HTTP token field is normalized before applying the transport grammar. Unknown request properties are accepted and discarded. Emitted tokens and values accepted directly by the presentation service remain canonical and contain no surrounding whitespace.
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/BenefitPresentationTokenInput'

    BenefitRedemptionPreview:
      type: object
      required: [token, expires_at, holder, benefit]
      additionalProperties: false
      properties:
