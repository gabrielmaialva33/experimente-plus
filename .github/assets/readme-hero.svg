<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="440"
  viewBox="0 0 1400 440"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Experimente+</title>
  <desc id="desc">Experimente+ brand banner for regional multi-city discovery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1722"/>
      <stop offset="54%" stop-color="#152032"/>
      <stop offset="100%" stop-color="#0A111B"/>
    </linearGradient>
    <linearGradient id="brandLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13467C"/>
      <stop offset="52%" stop-color="#519CEC"/>
      <stop offset="100%" stop-color="#F87325"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D6FE0"/>
      <stop offset="100%" stop-color="#13467C"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-14%" width="120%" height="128%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .sans {
      font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
      }
    </style>
  </defs>

  <rect width="1400" height="440" fill="url(#background)"/>
  <rect width="1400" height="440" fill="url(#grid)"/>

  <g transform="translate(60 50)" filter="url(#shadow)">
    <rect width="1280" height="340" rx="18" fill="#0F1722" stroke="#24314A"/>
    <rect x="1" y="1" width="1278" height="5" rx="2.5" fill="url(#brandLine)"/>

    <g transform="translate(92 74)">
      <rect width="132" height="132" rx="30" fill="url(#markFill)"/>
      <text
        class="sans"
        x="40"
        y="93"
        fill="#FFFFFF"
        font-size="76"
        font-weight="900"
      >E</text>
      <text
        class="sans"
        x="86"
        y="60"
        fill="#F87325"
        font-size="42"
        font-weight="900"
      >+</text>
      <path
        d="M35 112 H97"
        stroke="#FFFFFF"
        stroke-opacity="0.66"
        stroke-width="6"
        stroke-linecap="round"
      />
    </g>

    <g class="sans" transform="translate(262 92)">
      <text x="0" y="74" fill="#F8FAFC" font-size="72" font-weight="900">Experimente+</text>
      <text x="4" y="118" fill="#CBD5E1" font-size="25" font-weight="650">
        Descoberta regional multicidade
      </text>
      <rect x="4" y="150" width="436" height="3" rx="1.5" fill="url(#brandLine)"/>
    </g>

    <g transform="translate(875 82)">
      <rect x="0" y="0" width="280" height="176" rx="18" fill="#152032" stroke="#24314A"/>
      <g transform="translate(24 26)">
        <rect width="232" height="40" rx="10" fill="#1B2942"/>
        <circle cx="24" cy="20" r="9" fill="#519CEC"/>
        <rect x="46" y="13" width="132" height="14" rx="7" fill="#2C3D5C"/>
      </g>
      <g transform="translate(24 76)">
        <rect width="232" height="40" rx="10" fill="#1B2942"/>
        <circle cx="24" cy="20" r="9" fill="#519CEC"/>
        <rect x="46" y="13" width="104" height="14" rx="7" fill="#2C3D5C"/>
      </g>
      <g transform="translate(24 126)">
        <rect width="232" height="30" rx="9" fill="#CE4A09"/>
        <rect x="76" y="11" width="80" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
      </g>
    </g>
  </g>
</svg>
