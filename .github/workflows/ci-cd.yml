name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DB_PORT: 5432
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: experimente_plus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # pnpm 11 is required: pnpm-workspace.yaml uses the `allowBuilds` format
      # (pnpm 11) to whitelist native build scripts (argon2, better-sqlite3).
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: |
          cp .env.test .env
          mkdir -p tmp

      # Browser suite (tests/browser/**) uses Playwright/Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Type check (backend + frontend)
        run: pnpm typecheck

      - name: Deploy smoke regression tests (no database)
        run: node --test tests/deploy/*.test.mjs

      # Migrations run automatically in the Japa test setup; Postgres + Redis
      # come from the services above (.env.test points at localhost).
      - name: Backend tests (unit + functional + browser)
        run: pnpm test:e2e

      - name: Frontend tests (Vitest)
        run: pnpm test:ui

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to VPS
    needs: ci
    timeout-minutes: 75
    # Only master, only real pushes: a PR from a fork must never reach the host.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize CI requests too; deploy.sh's host flock also covers manual deploys.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The host must have the reviewed deploy entrypoint pre-installed outside the
      # checkout (see docs/runbooks/catalog_schema_reconciliation.md). It strictly
      # parses SSH_ORIGINAL_COMMAND as "deploy <full SHA>";
      # no eval, branch lookup, or fallback to a newer master tip is allowed.
      - name: Deploy
        timeout-minutes: 70
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "deploy $DEPLOY_REVISION"
