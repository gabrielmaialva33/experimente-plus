name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  # The checks run as parallel jobs, and the deploy waits for all of them. A
  # newer push to the same ref cancels the checks still running for an older
  # one (that run then never deploys); a deploy already started is never
  # cancelled, because its own concurrency group does not cancel.
  checks:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Type check (backend + frontend)
        run: pnpm typecheck

  deploy-regressions:
    name: Deploy regressions (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy-regressions-${{ matrix.shard.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # deploy.test.mjs and git_integrity.test.mjs simulate whole deploys and
      # dominate the suite, so each gets a runner of its own.
      matrix:
        shard:
          - name: deploy script
            files: tests/deploy/deploy.test.mjs
          - name: git integrity
            files: tests/deploy/git_integrity.test.mjs
          - name: contracts
            files: >-
              tests/deploy/catalog_migration_snapshot.test.mjs
              tests/deploy/catalog_smoke.test.mjs
              tests/deploy/deploy_revision_contract.test.mjs
              tests/deploy/docker_context_contract.test.mjs
              tests/deploy/native_dependencies.test.mjs
              tests/deploy/nginx_security_headers.test.mjs
              tests/deploy/progressive_web_app.test.mjs
              tests/deploy/reserved_paths.test.mjs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Deploy smoke regression tests (no database)
        run: node --test ${{ matrix.shard.files }}

  backend:
    name: Backend tests (Japa)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-backend
      cancel-in-progress: true
    env:
      DB_PORT: 5432
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: experimente_plus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup

      # Browser suite (tests/browser/**) uses Playwright/Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Migrations run automatically in the Japa test setup; Postgres + Redis
      # come from the services above (.env.test points at localhost).
      - name: Backend tests (unit + functional + browser)
        run: pnpm test:e2e

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-frontend
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Frontend tests (Vitest)
        run: pnpm test:ui

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to VPS
    needs: [checks, deploy-regressions, backend, frontend, build]
    timeout-minutes: 75
    # Only master, only real pushes: a PR from a fork must never reach the host.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize CI requests too; deploy.sh's host flock also covers manual deploys.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The host must have the reviewed deploy entrypoint pre-installed outside the
      # checkout. It strictly
      # parses SSH_ORIGINAL_COMMAND as "deploy <full SHA>";
      # no eval, branch lookup, or fallback to a newer master tip is allowed.
      - name: Deploy
        timeout-minutes: 70
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "deploy $DEPLOY_REVISION"
