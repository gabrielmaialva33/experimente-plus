# Mensagens de validação em português — auditoria de usabilidade da web (W7).
# O VineJS procura `validator.shared.messages.<regra>` e troca {field} pelo
# nome em `validator.shared.fields.<campo>`; o que faltar aqui cai no padrão em
# inglês da biblioteca. Formato ICU: variáveis entre chaves simples.
